<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d9488">
    <meta name="description" content="The page you're looking for could not be found.">
    <meta name="robots" content="noindex, nofollow">
    <title>Page not found | Wis Stationary</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1a1a1a;
            background: #f7f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(100%, 520px);
            padding: 48px 32px;
            text-align: center;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, .08);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #115e59;
            font-weight: 700;
            text-decoration: none;
        }

        .brand img {
            width: 40px;
            height: 40px;
            padding: 5px;
            object-fit: contain;
            background: #0d9488;
            border-radius: 8px;
        }

        .code {
            margin: 30px 0 0;
            color: #0f766e;
            font-size: clamp(4rem, 18vw, 6rem);
            font-weight: 800;
            letter-spacing: -.08em;
            line-height: 1;
        }

        h1 {
            margin: 16px 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0 auto 24px;
            color: #605e5c;
            line-height: 1.6;
        }

        .home {
            display: inline-block;
            padding: 12px 20px;
            color: #fff;
            background: #0d9488;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
        }

        .home:hover {
            background: #0f766e;
        }

        .home:focus-visible,
        .brand:focus-visible {
            outline: 3px solid #14b8a6;
            outline-offset: 4px;
        }

        @media (max-width: 420px) {
            main {
                padding: 36px 22px;
            }
        }
    </style>
</head>

<body>
    <main>
        <a class="brand" href="/">
            <img src="/stationary1.png" alt="">
            <span>Wis Stationary</span>
        </a>
        <p class="code" aria-hidden="true">404</p>
        <h1>We couldn't find that page</h1>
        <p>The address may be incorrect, or the page may have moved. Head back to the Wis Stationary home page.</p>
        <a class="home" href="/">Back to home</a>
    </main>
</body>

</html>
